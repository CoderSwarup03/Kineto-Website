<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kineto Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans" >

    <header class="w-full pt-4" id="header-placeholder"> 
        <!-- Top Section: Logo, Nav, Contact -->
        <div class="max-w-[1400px] mx-auto px-6 py-4 flex justify-between items-center">
            
            <!-- Logo -->
            <div class="flex-shrink-0">
                <img src="../image/logo-kineto.svg" alt="Kineto - Plug in to the future" class="h-12 object-contain">
            </div>

            <!-- Navigation -->
            <nav class="hidden lg:flex space-x-10 items-center mt-2">
                <a href="#" class="text-[#000000] font-semibold text-sm border-b-[3px] border-[#4caf50] pb-1">Home</a>
                <a href="#" class="text-[#000000] font-semibold text-sm hover:text-[#4caf50] pb-1">Products</a>
                <a href="#" class="text-[#000000] font-semibold text-sm hover:text-[#4caf50] pb-1">Solutions</a>
                <a href="#" class="text-[#000000] font-semibold text-sm hover:text-[#4caf50] pb-1">Projects</a>
                <a href="#" class="text-[#000000] font-semibold text-sm hover:text-[#4caf50] pb-1">Dealers</a>
                <a href="#" class="text-[#000000] font-semibold text-sm hover:text-[#4caf50] pb-1">Support</a>
            </nav>

            <!-- Contact Info -->
            <div class="hidden md:flex flex-col space-y-1.5">
                <!-- Phone -->
                <div class="flex items-center space-x-2 text-gray-700 text-sm">
                    <svg class="w-3.5 h-3.5 text-[#4caf50] fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <path d="M164.9 24.6c-7.7-18.6-28-28.5-47.4-23.2l-88 24C12.1 30.2 0 46 0 64C0 311.4 200.6 512 448 512c18 0 33.8-12.1 38.6-29.5l24-88c5.3-19.4-4.6-39.7-23.2-47.4l-96-40c-16.3-6.8-35.2-2.1-46.3 11.6L304.7 368C234.3 334.7 177.3 277.7 144 207.3L193.3 167c13.7-11.2 18.4-30 11.6-46.3l-40-96z"/>
                    </svg>
                    <span class="tracking-wide text-[15px] text-gray-600 font-medium">+91 086977 77888</span>
                </div>
                <!-- Email -->
                <div class="flex items-center space-x-2 text-gray-700 text-sm">
                    <svg class="w-3.5 h-3.5 text-[#4caf50] fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z"/>
                    </svg>
                    <a href="mailto:support@kinetoindia.com" class="text-[15px] text-gray-600 font-medium hover:text-[#4caf50] transition-colors">support@kinetoindia.com</a>
                </div>
            </div>
            <!-- menu icon -->
            <div id="menu-icon">
                <svg class="md:hidden w-6 h-6 text-[#4caf50] cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </div>
        </div>

        <!-- Bottom Section: Search Bar -->
        <div class="max-w-[750px] mx-auto px-6 pb-6 pt-2">
            <!-- Simulated Input Field visually matching the design -->
            <button class="w-full bg-[#efefef] hover:bg-gray-200 transition-colors flex items-center justify-center py-2.5 rounded-[2px]">
                <svg class="w-4 h-4 mr-2 text-[#222222]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <span class="text-[13px] font-semibold text-[#000000]">Search for products</span>
            </button>
        </div>
    </header>

</body>
</html>

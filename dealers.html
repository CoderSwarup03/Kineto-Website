    <!-- Async/Await header/footer Include Script -->
    <script>
        async function loadComponent(containerId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`Failed to load ${filePath}: ${response.statusText}`);
                }
                const html = await response.text();
                document.getElementById(containerId).innerHTML = html;
            } catch (error) {
                console.error('Error loading component:', error);
            }
        }

        async function initLayout() {
            await loadComponent('header-placeholder', 'include/header.html');
            await loadComponent('footer-placeholder', 'Include/footer.html');
        }

        initLayout();
    </script>


    <!-- hero slider -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const track = document.getElementById('slider-track');
            const slides = track.children;
            const nextButton = document.getElementById('next-slide');
            const prevButton = document.getElementById('prev-slide');
            const dots = document.querySelectorAll('.slider-dot');

            let currentIndex = 0;
            const totalSlides = slides.length;
            let autoSlideInterval;

            // Function to update the slider position and dots
            const updateSlider = (index) => {
                // Move the track
                track.style.transform = `translateX(-${index * 100}%)`;

                // Update dots styling
                dots.forEach(dot => {
                    dot.classList.remove('bg-white');
                    dot.classList.add('bg-white/50');
                });
                dots[index].classList.remove('bg-white/50');
                dots[index].classList.add('bg-white');

                currentIndex = index;
            };

            const nextSlide = () => {
                const index = (currentIndex + 1) % totalSlides;
                updateSlider(index);
            };

            const prevSlide = () => {
                const index = (currentIndex - 1 + totalSlides) % totalSlides;
                updateSlider(index);
            };

            // Event Listeners for Arrows
            nextButton.addEventListener('click', () => {
                nextSlide();
                resetAutoSlide();
            });

            prevButton.addEventListener('click', () => {
                prevSlide();
                resetAutoSlide();
            });

            // Event Listeners for Dots
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    updateSlider(index);
                    resetAutoSlide();
                });
            });

            // Auto-slide functionality (Changes slide every 5 seconds)
            const startAutoSlide = () => {
                autoSlideInterval = setInterval(nextSlide, 5000);
            };

            const resetAutoSlide = () => {
                clearInterval(autoSlideInterval);
                startAutoSlide();
            };

            // Initialize auto-slide
            startAutoSlide();
        });
    </script>

    <!-- search script -->
    <script>
        // 1. Show/Hide the "X" when typing
        document.addEventListener('input', function (event) {
            if (event.target && event.target.id === 'search-input') {
                const searchInput = event.target;
                const searchIcon = document.getElementById('search-icon');
                const clearBtn = document.getElementById('clear-search-btn');

                if (searchInput.value.length > 0) {
                    // Hide magnifying glass
                    if (searchIcon) searchIcon.style.opacity = '0';

                    // Show X button
                    if (clearBtn) {
                        clearBtn.classList.remove('opacity-0', 'pointer-events-none');
                        clearBtn.classList.add('opacity-100', 'pointer-events-auto');
                    }
                } else {
                    // Show magnifying glass
                    if (searchIcon) searchIcon.style.opacity = '1';

                    // Hide X button
                    if (clearBtn) {
                        clearBtn.classList.remove('opacity-100', 'pointer-events-auto');
                        clearBtn.classList.add('opacity-0', 'pointer-events-none');
                    }
                }
            }
        });

        // 2. Handle the "X" click
        document.addEventListener('click', function (event) {
            const clearBtn = event.target.closest('#clear-search-btn');

            if (clearBtn) {
                const searchInput = document.getElementById('search-input');
                const searchIcon = document.getElementById('search-icon');

                if (searchInput) {
                    searchInput.value = '';
                    searchInput.focus(); // Keep cursor in the box
                }

                // Hide the "X"
                clearBtn.classList.remove('opacity-100', 'pointer-events-auto');
                clearBtn.classList.add('opacity-0', 'pointer-events-none');

                // Show the magnifying glass
                if (searchIcon) searchIcon.style.opacity = '1';
            }
        });
    </script>

    <!-- Script to Handle "See more" Toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const seeMoreBtn = document.getElementById('see-more-btn');
            const hiddenProducts = document.querySelectorAll('.extra-product');

            let isExpanded = false;

            seeMoreBtn.addEventListener('click', () => {
                isExpanded = !isExpanded; // Toggle state

                hiddenProducts.forEach(product => {
                    if (isExpanded) {
                        product.classList.remove('hidden');
                        product.classList.add('flex'); // Add flex to maintain column layout
                    } else {
                        product.classList.add('hidden');
                        product.classList.remove('flex');
                    }
                });

                // Update button text
                seeMoreBtn.textContent = isExpanded ? 'See less' : 'See more';
            });
        });
    </script>

    <!-- Location Search & Map Update Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchForm = document.getElementById('dealer-search-form');
            const locationInput = document.getElementById('dealer-location-input');
            const useCurrentLocationBtn = document.getElementById('use-current-location-btn');
            const mapIframe = document.getElementById('dealer-map-iframe');

            // Function to update the Google Map iframe source
            const updateMapLocation = (query) => {
                // Encode the query so it's URL-safe (e.g., handles spaces and special characters)
                const encodedQuery = encodeURIComponent(query);
                mapIframe.src = `https://www.google.com/maps?q=${encodedQuery}&output=embed`;
            };

            // 1. Handle Typed Search Submission
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const query = locationInput.value.trim();

                if (query) {
                    // Update map to show the typed location
                    updateMapLocation(query);
                    locationInput.blur(); // Remove focus from keyboard
                }
            });

            // 2. Handle "Use current location" Click (Geolocation API)
            useCurrentLocationBtn.addEventListener('click', () => {

                if (navigator.geolocation) {
                    const originalText = useCurrentLocationBtn.innerHTML;
                    useCurrentLocationBtn.innerHTML = "Detecting location...";
                    useCurrentLocationBtn.disabled = true;

                    navigator.geolocation.getCurrentPosition(
                        // Success Callback
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;

                            useCurrentLocationBtn.innerHTML = originalText;
                            useCurrentLocationBtn.disabled = false;

                            // Fill the input with coordinates
                            const coordsStr = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                            locationInput.value = coordsStr;

                            // Update map using the exact coordinates
                            updateMapLocation(coordsStr);
                        },
                        // Error Callback
                        (error) => {
                            useCurrentLocationBtn.innerHTML = originalText;
                            useCurrentLocationBtn.disabled = false;
                            console.error("Geolocation error:", error);

                            switch (error.code) {
                                case error.PERMISSION_DENIED:
                                    alert("Location request denied. Please type your city or state manually.");
                                    break;
                                case error.POSITION_UNAVAILABLE:
                                    alert("Location information is unavailable right now.");
                                    break;
                                case error.TIMEOUT:
                                    alert("The request to get user location timed out.");
                                    break;
                                default:
                                    alert("An unknown error occurred.");
                                    break;
                            }
                        },
                        // Options
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else {
                    alert("Geolocation is not supported by your browser. Please type your location manually.");
                }
            });
        });
    </script>

    <!-- Active Navigation State Logic -->
    <!-- smooth animation bar open -->
    <script>
        // --- 1. Global Click Logic for Menus and Search Bar ---
        document.addEventListener('click', function (event) {

            // ---------------------------------------------------------
            // A. Mobile Hamburger Menu Toggle (Smooth Animation)
            // ---------------------------------------------------------
            const menuBtn = event.target.closest('#menu-icon');
            if (menuBtn) {
                event.preventDefault();
                const mobileMenu = document.getElementById('mobile-menu');

                if (mobileMenu) {
                    const isHidden = mobileMenu.classList.contains('hidden');

                    if (isHidden) {
                        mobileMenu.classList.remove('hidden');
                        mobileMenu.classList.add('flex');

                        mobileMenu.style.transition = 'none';
                        mobileMenu.style.opacity = '0';
                        mobileMenu.style.transform = 'translateY(-15px)';

                        void mobileMenu.offsetHeight; // Reflow

                        mobileMenu.style.transition = 'opacity 0.3s ease-out, transform 0.3s ease-out';
                        mobileMenu.style.opacity = '1';
                        mobileMenu.style.transform = 'translateY(0)';
                    } else {
                        mobileMenu.style.opacity = '0';
                        mobileMenu.style.transform = 'translateY(-15px)';

                        setTimeout(() => {
                            if (mobileMenu.style.opacity === '0') {
                                mobileMenu.classList.add('hidden');
                                mobileMenu.classList.remove('flex');
                                mobileMenu.style.transition = '';
                                mobileMenu.style.opacity = '';
                                mobileMenu.style.transform = '';
                            }
                        }, 300);
                    }
                }
            }

            // ---------------------------------------------------------
            // B. Desktop Products Submenu Toggle
            // ---------------------------------------------------------
            const desktopProductsBtn = event.target.closest('#desktop-products-btn');
            if (desktopProductsBtn) {
                event.preventDefault();
                const desktopSubmenu = document.getElementById('desktop-products-submenu');
                if (desktopSubmenu) {
                    desktopSubmenu.classList.toggle('hidden');
                }
            }

            // ---------------------------------------------------------
            // C. Mobile Products Accordion Toggle (Smooth Animation)
            // ---------------------------------------------------------
            const mobileProductsBtn = event.target.closest('#mobile-products-btn');
            if (mobileProductsBtn) {
                event.preventDefault();
                const mobileSubmenu = document.getElementById('mobile-products-submenu');
                const mobileIcon = document.getElementById('mobile-products-icon');

                if (mobileSubmenu) {
                    const isSubmenuHidden = mobileSubmenu.classList.contains('hidden');

                    if (isSubmenuHidden) {
                        // Step 1: Render in DOM
                        mobileSubmenu.classList.remove('hidden');
                        mobileSubmenu.classList.add('flex');

                        // Step 2: Set invisible, collapsed starting point
                        mobileSubmenu.style.overflow = 'hidden';
                        mobileSubmenu.style.maxHeight = '0px';
                        mobileSubmenu.style.opacity = '0';
                        mobileSubmenu.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';

                        // Step 3: Force Reflow
                        void mobileSubmenu.offsetHeight;

                        // Step 4: Expand to exact natural height
                        mobileSubmenu.style.maxHeight = mobileSubmenu.scrollHeight + 'px';
                        mobileSubmenu.style.opacity = '1';

                        // Clean up max-height constraint after animation finishes
                        setTimeout(() => {
                            if (mobileSubmenu.style.opacity === '1') {
                                mobileSubmenu.style.maxHeight = 'none';
                                mobileSubmenu.style.overflow = 'visible';
                            }
                        }, 300);

                    } else {
                        // CLOSING ANIMATION
                        // Step 1: Explicitly set current height to give CSS a starting point
                        mobileSubmenu.style.maxHeight = mobileSubmenu.scrollHeight + 'px';
                        mobileSubmenu.style.overflow = 'hidden';

                        // Step 2: Force Reflow
                        void mobileSubmenu.offsetHeight;

                        // Step 3: Shrink and fade
                        mobileSubmenu.style.maxHeight = '0px';
                        mobileSubmenu.style.opacity = '0';

                        // Step 4: Wait for finish, then remove from DOM
                        setTimeout(() => {
                            if (mobileSubmenu.style.opacity === '0') {
                                mobileSubmenu.classList.add('hidden');
                                mobileSubmenu.classList.remove('flex');

                                // Cleanup inline styles
                                mobileSubmenu.style.maxHeight = '';
                                mobileSubmenu.style.opacity = '';
                                mobileSubmenu.style.transition = '';
                                mobileSubmenu.style.overflow = '';
                            }
                        }, 300);
                    }

                    // Rotate the arrow icon
                    if (mobileIcon) {
                        mobileIcon.classList.toggle('rotate-180');
                    }
                }
            }

            // ---------------------------------------------------------
            // D. Close Desktop Submenu if clicking outside
            // ---------------------------------------------------------
            const desktopSubmenu = document.getElementById('desktop-products-submenu');
            if (desktopSubmenu && !desktopSubmenu.classList.contains('hidden')) {
                if (!event.target.closest('#desktop-products-btn') && !event.target.closest('#desktop-products-submenu')) {
                    desktopSubmenu.classList.add('hidden');
                }
            }

            // ---------------------------------------------------------
            // E. Search Bar 'X' Clear Button Logic
            // ---------------------------------------------------------
            const clearBtn = event.target.closest('#clear-search-btn');
            if (clearBtn) {
                const searchInput = document.getElementById('search-input');
                const searchIcon = document.getElementById('search-icon');

                if (searchInput) {
                    searchInput.value = '';
                    searchInput.focus();
                }

                clearBtn.classList.remove('opacity-100', 'pointer-events-auto');
                clearBtn.classList.add('opacity-0', 'pointer-events-none');

                if (searchIcon) searchIcon.style.opacity = '1';
            }
        });

        // --- 2. Search Bar Typing Logic ---
        document.addEventListener('input', function (event) {
            if (event.target && event.target.id === 'search-input') {
                const searchInput = event.target;
                const searchIcon = document.getElementById('search-icon');
                const clearBtn = document.getElementById('clear-search-btn');

                if (searchInput.value.length > 0) {
                    if (searchIcon) searchIcon.style.opacity = '0';
                    if (clearBtn) {
                        clearBtn.classList.remove('opacity-0', 'pointer-events-none');
                        clearBtn.classList.add('opacity-100', 'pointer-events-auto');
                    }
                } else {
                    if (searchIcon) searchIcon.style.opacity = '1';
                    if (clearBtn) {
                        clearBtn.classList.remove('opacity-100', 'pointer-events-auto');
                        clearBtn.classList.add('opacity-0', 'pointer-events-none');
                    }
                }
            }
        });
    </script>
